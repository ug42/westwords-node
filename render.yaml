# Render Blueprint: https://render.com/docs/blueprint-spec
# New > Blueprint > pick this repo. The free plan supports WebSockets.
services:
  - type: web
    name: westwords
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
